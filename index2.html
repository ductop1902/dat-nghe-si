<style>:root{padding-top:env(safe-area-inset-top,0px)}html{-webkit-text-size-adjust:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Bản test 2 — người dùng chính là người trẻ. Khám phá (trang chủ, tìm kiếm, hồ sơ, đã lưu) là "sân khấu" tối, nhiều hình;
   giao dịch (yêu cầu, báo giá, booking, tiền) nền theo giao diện máy, ưu tiên đọc rõ. */
:root{
  --stage:#0e0f14; --stage-2:#191a23; --stage-3:#232533; --stage-line:#2f3144; --on-stage:#f4f3fa; --on-stage-2:#b9b8cc;
  --bg:#f6f4ef; --card:#ffffff; --ink:#171923; --ink-2:#555b6e; --line:#e2dfd6;
  --brand:#7c3aed; --brand-2:#a855f7; --brand-ink:#5b21b6; --brand-soft:#efe7ff; --gold:#d7b46a; --gold-ink:#7a5a14; --pink:#ec4899;
  --ok:#166534; --ok-bg:#dcfce7; --warn:#8a4b00; --warn-bg:#fff1d6; --bad:#b42318; --bad-bg:#fee4e2; --info:#1e4fa3; --info-bg:#e0ebff; --mute-bg:#eceae4;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14151c; --card:#1d1f29; --ink:#eeedf5; --ink-2:#a9abbd; --line:#30323f;
  --brand:#8b5cf6; --brand-ink:#c4b5fd; --brand-soft:#2a2340; --gold-ink:#e2c88a;
  --ok:#86efac; --ok-bg:#12301e; --warn:#fcd38a; --warn-bg:#35270e; --bad:#fca5a5; --bad-bg:#3a1616; --info:#a5c4ff; --info-bg:#16233c; --mute-bg:#262834; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14151c; --card:#1d1f29; --ink:#eeedf5; --ink-2:#a9abbd; --line:#30323f;
  --brand:#8b5cf6; --brand-ink:#c4b5fd; --brand-soft:#2a2340; --gold-ink:#e2c88a;
  --ok:#86efac; --ok-bg:#12301e; --warn:#fcd38a; --warn-bg:#35270e; --bad:#fca5a5; --bad-bg:#3a1616; --info:#a5c4ff; --info-bg:#16233c; --mute-bg:#262834; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;transition:background-color .25s}
body[data-page="discover"]{background:var(--stage);color:var(--on-stage)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--stage)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;overflow-x:clip}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bleed{margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)))}
/* đầu trang */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(14,15,20,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--on-stage);display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--stage-line)}
.mark{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#ec4899)}
.mark svg{width:18px;height:18px}
.brand{font-weight:800;font-size:17px;min-width:0;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--on-stage-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{margin-left:auto;white-space:nowrap;flex:none;display:flex;align-items:center;gap:6px;background:var(--stage-2);border:1px solid var(--stage-line);border-radius:999px;padding:6px 10px 6px 12px;min-height:40px;font-size:13px;font-weight:600;cursor:pointer;color:var(--on-stage)}
.who .r{color:var(--gold);font-weight:700}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;background:none;border:0;color:var(--brand-ink);font-weight:600;padding:0;cursor:pointer}
body[data-page="discover"] .back{color:#d8c7ff}
main{flex:1;padding-block:14px 110px}
main.enter{animation:enter .28s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* thanh tab dưới */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));transition:background-color .25s}
body[data-page="discover"] .tabs{background:rgba(14,15,20,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-color:var(--stage-line)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;min-width:0;justify-content:center;border:0;background:none;border-radius:12px;color:var(--ink-2);font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;padding:0 2px}
body[data-page="discover"] .tab{color:var(--on-stage-2)}
.tab span.l{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--brand-ink);background:var(--brand-soft)}
body[data-page="discover"] .tab[aria-current="page"]{color:#fff;background:rgba(139,92,246,.28)}
.dot{position:absolute;top:3px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center}
/* chung */
.stack{display:grid;gap:12px}
.stack-lg{display:grid;gap:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.between>*{min-width:0}
.muted{color:var(--ink-2)} .small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.h1{font-size:24px;font-weight:800;letter-spacing:-.01em} .h2{font-size:19px;font-weight:700} .h3{font-size:16px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:12px;border:1.5px solid transparent;font-weight:700;cursor:pointer;text-align:center;transition:transform .1s, background-color .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.primary{background:var(--brand);color:#fff}
.grad{background:linear-gradient(135deg,#7c3aed,#c026d3 60%,#ec4899);color:#fff;box-shadow:0 8px 24px -10px rgba(192,38,211,.7)}
.outline{background:transparent;border-color:var(--brand);color:var(--brand-ink)}
.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.danger{background:transparent;border-color:var(--bad);color:var(--bad)}

function refundSuggestion(b,who){

/* QĐ Giám đốc 03/11: mốc hủy tính theo NGÀY LỊCH giờ Việt Nam (ngày diễn − ngày hủy). */
const calDays=(a,b2)=>Math.round((Date.parse(vnDate(a))-Date.parse(vnDate(b2)))/D);
function cancelPct(b){const days=calDays(b.start,now());return (b.snap.policy.find(r=>days>=r.min)||{pct:0}).pct}
/* QĐ Giám đốc 03/11: tiền khách chuyển/báo SAU lúc hủy được hoàn 100%; % chỉ áp cho tiền đến trước khi hủy. */
function refundDue(b){
  const ins=S.payments.filter(p=>p.booking===b.id&&p.status==="da_nhan"&&p.kind!=="hoan_tien");
  if(b.cancelBy!=="customer")return ins.reduce((s,p)=>s+p.amount,0);
  const before=ins.filter(p=>p.at<=b.cancelAt).reduce((s,p)=>s+p.amount,0), after=ins.filter(p=>p.at>b.cancelAt).reduce((s,p)=>s+p.amount,0);
  const dep=Math.min(before,b.deposit); return Math.round(dep*(b.cancelPct??0)/100)+(before-dep)+after;
}

  b.cancelAt=now();b.cancelPct=who==="customer"?cancelPct(b):100;b.refund=refundSuggestion(b,who);b.status="huy";b.cancelBy=who;b.cancelReason=reason.trim();

function act(fn,okText){const snap=JSON.stringify(S),vsnap=JSON.stringify(V);try{fn();save();if(okText)toast(okText);render()}catch(e){S=JSON.parse(snap);V=JSON.parse(vsnap);const m=e instanceof Err?e.message:"Có lỗi không mong muốn: "+e.message;if(!(e instanceof Err))console.error(e);showErr(m)}}
function showErr(m){const main=document.getElementById("main");let el=main.querySelector(":scope > .err[data-live]");if(!el){el=document.createElement("div");el.className="err";el.setAttribute("role","alert");el.dataset.live="1";main.prepend(el)}el.textContent=m;scrollTo({top:0,behavior:"smooth"})}

function render(){
  sweep(); save();
  const u=me(); if(!V.tab||!TABS[u.role].some(t=>t[0]===V.tab))V.tab=TABS[u.role][0][0];
  const top=V.stack[V.stack.length-1];
  const key=top?top.v+":"+(top.id||""):V.tab;
  document.body.dataset.page=DISCOVER.has(top?top.v:V.tab)?"discover":"work";
  const unread=S.notifs.filter(n=>n.user===u.id&&!n.read).length;
  document.getElementById("top").innerHTML=`<span class="mark" aria-hidden="true">${svg("mic",2.2)}</span><div class="brand">Đặt nghệ sĩ<small>Bản test 2 · ${esc(dt(now()))}</small></div>
    <button class="who" data-a="sheet" aria-label="Đổi người dùng và công cụ thử nghiệm"><span>${esc(u.name)}</span><span class="r">${ROLE[u.role]}</span></button>`;
  document.getElementById("tabs").innerHTML=TABS[u.role].map(([k,l,i])=>`<button class="tab" data-tab="${k}" ${V.tab===k&&!V.stack.length?'aria-current="page"':""}>${svg(i)}<span class="l">${l}</span>${k==="thong-bao"&&unread?`<span class="dot">${unread}</span>`:""}${k==="da-luu"&&savedList().length?`<span class="dot" style="background:#ec4899">${savedList().length}</span>`:""}</button>`).join("");
  const html=top?`<button class="back" data-a="back">← Quay lại</button>`+(VIEWS[top.v]||(()=>"Không tìm thấy màn hình."))(top):PAGES[V.tab]();
  const main=document.getElementById("main");
  main.innerHTML=html;
  if(key!==lastKey){main.classList.remove("enter");void main.offsetWidth;main.classList.add("enter");if(lastKey)scrollTo(0,0);lastKey=key}
  bindMoney();
}
function bindMoney(){document.querySelectorAll("input[data-money]").forEach(el=>el.addEventListener("input",()=>{const d=el.value.replace(/\D/g,"");el.value=d?Number(d).toLocaleString("vi-VN"):"";const t=document.getElementById("qtotal");if(t){let s=0;document.querySelectorAll("input[data-sum]").forEach(x=>s+=Number(x.value.replace(/\D/g,"")||0));t.textContent=vnd(s);const d2=document.getElementById("qd");if(d2&&!d2.dataset.touched&&s>0)d2.value=Math.round(s*CFG.depDef/100).toLocaleString("vi-VN")}}))}

function dtPicker(p,date,time,dur,dark){
  const t=now(),sat=nextSat(t),sun=sat+D;
  const quick=[["T7 này",vnDate(sat)],["CN này",vnDate(sun)],["T7 tuần sau",vnDate(sat+7*D)]];
  const times=[];for(let h=7;h<=23;h++)for(const m of ["00","30"])times.push(`${String(h).padStart(2,"0")}:${m}`);
  const durs=[1,1.5,2,2.5,3,4,5,6,8];

/* QR MÔ PHỎNG (không quét được để thanh toán): hoa văn sinh từ nội dung, có 3 ô định vị như mã QR. */
function mockQr(text){
  let h=2166136261;for(const c of text){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}
  const n=25,cells=[];const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h};
  const finder=(x,y)=>[[0,0],[n-7,0],[0,n-7]].some(([fx,fy])=>x>=fx&&x<fx+7&&y>=fy&&y<fy+7);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(finder(x,y))continue;if(rnd()%2)cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`)}
  const f=([fx,fy])=>`<rect x="${fx}" y="${fy}" width="7" height="7"/><rect x="${fx+1}" y="${fy+1}" width="5" height="5" fill="#fff"/><rect x="${fx+2}" y="${fy+2}" width="3" height="3"/>`;
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="Mã QR mô phỏng" fill="#111">${cells.join("")}${[[0,0],[n-7,0],[0,n-7]].map(f).join("")}</svg>`;
}

/* ---------- tìm kiếm ---------- */
function searchResults(q){
  const t=fold(q.text);
  const s=q.date?fromVN(q.date,q.time||"19:00"):null, e=s!=null?s+Number(q.dur||3)*H:null;
  let list=visibleArtists().filter(a=>{
    if(q.svc&&a.svc!==q.svc)return false;
    if(q.occ&&!a.occ.includes(q.occ))return false;
    if(q.tag&&!a.tags.includes(q.tag))return false;
    if(q.price>=0){const [,lo,hi]=PRICE[q.price];if(a.price==null||a.price<lo||a.price>=hi)return false}
    if(t){const hay=fold([a.name,a.genres,a.bio,SVC[a.svc],a.tags.map(x=>(COLL.find(c=>c[0]===x)||[,x])[1]).join(" "),a.occ.map(occLabel).join(" ")].join(" "));if(!t.split(/\s+/).every(w=>hay.includes(w)))return false}
    return true}).map(a=>({a,free:s!=null?!(busy(a.id,s,e)||a.suspendedUntil>now()):null}));
  list.sort((x,y)=>(y.free===true)-(x.free===true));
  return {list,s,e};
}
function resultCard({a,free}){
  return `<div class="d-card res" role="link" tabindex="0" data-a="artist" data-id="${a.id}">${vis(a,"","Ảnh chờ cung cấp")}
    <div style="min-width:0;padding-right:34px"><div class="tagrow"><span class="tag">${SVC[a.svc]}</span>${free===true?'<span class="avail y">Rảnh khung giờ này</span>':free===false?'<span class="avail n">Bận khung giờ này</span>':""}</div>

}

  req:({id})=>{

    if(u.role==="artist"||invs.length)html+=`<div class="stack">${u.role!=="artist"?`<div class="field"><label for="mt">Gửi tới</label><select id="mt">${invs.map(i=>`<option value="${i.artist}" ${i.artist===threadArtist?"selected":""}>${esc(artist(i.artist).name)}</option>`).join("")}</select></div>`:""}<div class="field"><label for="mb">Tin nhắn</label><textarea id="mb" maxlength="2000"></textarea></div><button class="btn outline" data-a="msg" data-id="${id}">Gửi tin nhắn</button></div>`;
    if(isCust&&["da_gui","dang_tim"].includes(r.status))html+=`<button class="btn danger" data-a="closereq" data-id="${id}">Hủy yêu cầu</button>`;

  compare:({id})=>{

    return `<div class="stack"><h1 class="h1">So sánh báo giá</h1><p class="hint">Vuốt ngang nếu không thấy hết. "Tổng thấp nhất" chỉ so số tiền, không phải đánh giá chất lượng.</p>
      <div class="cmp"><table><thead><tr><th></th>${qs.map(q=>`<th><div class="artist-mini">${vis(artist(q.artist),""," ")}<b>${esc(artist(q.artist).name)}</b></div></th>`).join("")}</tr></thead><tbody>
      <tr><td>Tổng</td>${cell(q=>`<b class="${q.total===minT?"best":""}">${vnd(q.total)}</b>${q.total===minT?'<div class="small" style="color:var(--ok)">Tổng thấp nhất</div>':""}`)}</tr>
      <tr><td>Cọc</td>${cell(q=>`${vnd(q.deposit)}<div class="small muted">${Math.round(q.deposit*100/Math.max(1,q.total))}% tổng</div>`)}</tr>

      <tr><td>Phạm vi</td>${cell(q=>`<div class="small">${esc(q.scope)}</div>`)}</tr>
      <tr><td>Hiệu lực</td>${cell(q=>{const h=Math.max(0,Math.round((q.validUntil-now())/H));return `${esc(dt(q.validUntil))}<div class="small ${h<24?"":"muted"}" style="${h<24?"color:var(--warn);font-weight:700":""}">${h<24?"Còn "+h+" giờ":"Còn "+Math.round(h/24)+" ngày"}</div>`})}</tr>
      <tr><td>Hủy</td>${cell(()=>`<div class="small">≥30 ngày lịch hoàn 100% cọc · 8–29 ngày 50% · ≤7 ngày 0% · tiền chuyển sau khi hủy hoàn đủ</div>`)}</tr>
      <tr><td></td>${cell(q=>`<button class="btn primary" style="width:100%" data-a="accept" data-id="${q.id}">Chọn & giữ lịch</button>`)}</tr>
      </tbody></table></div></div>`},
  quote:({id})=>{const r=S.requests.find(x=>x.id===id);return `<form class="stack" id="quoteform" data-id="${id}" novalidate><h1 class="h1">Gửi báo giá</h1><p class="muted">${esc(r.event)} · ${esc(range(r.start,r.end))} · ${esc(r.area)}</p>
    <p class="hint">Tổng tiền do hệ thống cộng từ các hạng mục. Cọc phải từ ${CFG.depMin}% đến ${CFG.depMax}% tổng (tự điền ${CFG.depDef}%, sửa được).</p>
    ${[["bieu_dien","Biểu diễn"],["di_chuyen","Di chuyển"],["thiet_bi","Thiết bị"]].map(([k,l],n)=>`<div class="card stack"><div class="h3">${l}</div><input type="hidden" class="qk" value="${k}"><div class="two"><div class="field"><label for="ql${n}">Mô tả</label><input id="ql${n}" class="ql"></div><div class="field"><label for="qa${n}">Số tiền (VNĐ)</label><input id="qa${n}" class="qa" inputmode="numeric" data-money data-sum></div></div></div>`).join("")}

    <p class="hint">Điều kiện hủy áp dụng chung: khách hủy ≥30 ngày (tính theo ngày lịch) hoàn 100% cọc, 8–29 ngày hoàn 50%, ≤7 ngày không hoàn; nghệ sĩ hủy hoàn 100% khách đã trả.</p>
    <button class="btn primary block" type="submit">Gửi báo giá</button></form>`},
  booking:({id})=>{
    const b=S.bookings.find(x=>x.id===id),r=S.requests.find(x=>x.id===b.req),a=artist(b.artist),u=me();
    const isCust=b.customer===u.id,isArtist=a.owner===u.id,staff=u.role==="coordinator";
    const steps=[["cho_xac_nhan","Chờ cọc"],["da_xac_nhan","Đã xác nhận"],["dang_thuc_hien","Đang diễn"],["cho_hoan_tat","Chờ xác nhận"],["hoan_thanh","Hoàn thành"]];
    const idx=steps.findIndex(s=>s[0]===b.status);
    const pays=S.payments.filter(p=>p.booking===b.id), p=paid(b), ended=["huy","hoan_thanh"].includes(b.status);
    const nextAmt=p<b.deposit?b.deposit-p-pendingIn(b):b.total-p-pendingIn(b);
    let next="",btn="";
    if(b.status==="cho_xac_nhan")next=isCust?(pendingIn(b)?"Đã báo chuyển khoản — chờ nghệ sĩ xác nhận đã nhận.":`Chuyển cọc ${vnd(b.deposit-p)} vào tài khoản nghệ sĩ (quét mã bên dưới), rồi bấm "Báo đã chuyển khoản".`):isArtist?"Chờ khách chuyển cọc. Khi tiền vào tài khoản, xác nhận ở mục Tiền.":"Chờ khách chuyển cọc và nghệ sĩ xác nhận.";
    if(b.status==="da_xac_nhan"){const opens=b.start-CFG.startWin;if(isArtist||staff){if(now()>=opens){next="Đã đến khung giờ diễn.";btn=`<button class="btn primary" data-a="adv" data-v="bat_dau" data-id="${b.id}">Bắt đầu biểu diễn</button>`}else next=`Booking đã xác nhận. Nút "Bắt đầu" mở từ ${dt(opens)}.`}else next="Booking đã xác nhận. Chuẩn bị kịch bản và liên hệ hiện trường."}
    if(b.status==="dang_thuc_hien"){next="Show đang diễn ra.";if((isArtist||staff)&&now()>=b.start)btn=`<button class="btn primary" data-a="adv" data-v="ket_thuc" data-id="${b.id}">Kết thúc show</button>`}
    if(b.status==="cho_hoan_tat"){next=isCust?"Xác nhận show đã hoàn tất, hoặc báo sự cố nếu có vấn đề.":"Chờ khách xác nhận hoàn tất.";if(isCust||staff)btn=`<button class="btn primary" data-a="adv" data-v="hoan_tat" data-id="${b.id}">Xác nhận đã hoàn tất</button>`}
    let html=`<div class="stack"><div class="between"><div><div class="kicker">${esc(r.event)} · Booking <span class="code">${b.code}</span></div><h1 class="h1">${esc(a.name)}</h1><p class="muted">${esc(range(b.start,b.end))}</p></div>${badge(b.status)}</div>`;
    html+=b.status==="huy"?`<div class="err">Booking đã hủy (${b.cancelBy==="customer"?"khách":b.cancelBy==="artist"?"nghệ sĩ":b.cancelBy==="staff_no_show"?"điều phối xác nhận nghệ sĩ bỏ show":"điều phối"}): ${esc(b.cancelReason)}. Hoàn đề xuất theo điều kiện đã đồng ý: <b>${vnd(b.refund)}</b>.</div>`:
      `<div class="timeline">${steps.map(([s,l],i)=>`<div class="${i<idx?"done":i===idx?"cur":""}"><i>${i<idx?"✓":i+1}</i>${l}</div>`).join("")}</div>`;
    if(next)html+=`<div class="next" role="status">${esc(next)}${btn?`<div style="margin-top:8px">${btn}</div>`:""}</div>`;
    if(!ended)html+=`<section class="card stack"><div class="h3">Checklist trước giờ diễn</div><ul class="list small"><li>• Có mặt trước: <b>${esc(tm(b.start-CFG.buffer))}</b> (bắt đầu ${esc(tm(b.start))})</li><li>• Địa điểm: ${esc(r.address)}</li><li>• Liên hệ hiện trường: ${esc(r.contact||"chưa có — khách bổ sung qua tin nhắn")}</li>${(isArtist||staff)?`<li>• SĐT khách: ${esc(S.verified[b.customer]||"khách chưa xác thực")}</li>`:""}<li>• Kịch bản/bài hát: ${esc(r.style||"thống nhất qua tin nhắn")}</li></ul></section>`;
    html+=`<section class="card stack"><div class="h2">Tiền</div>`;
    if((isCust||staff)&&a.payout&&!ended&&nextAmt>0)html+=`<div class="card" style="background:var(--brand-soft);border:0"><div class="qr">${mockQr("DNS "+b.code+" "+nextAmt)}<div style="min-width:0"><div class="small">Chuyển khoản tới nghệ sĩ</div><div><b>${esc(a.payout.bank)}</b></div><div class="code" style="overflow-wrap:anywhere">${esc(a.payout.number)}</div><div class="small">${esc(a.payout.holder)}</div><div class="small">Số tiền: <b>${vnd(nextAmt)}</b></div><div class="small">Nội dung: <span class="code">DNS ${b.code}</span></div><span class="stamp">QR MÔ PHỎNG · KHÔNG CHUYỂN TIỀN</span></div></div>
      <p class="small" style="margin-top:8px">Bản thật: mã VietQR, quét bằng app ngân hàng là tự điền tài khoản, số tiền và nội dung. Tiền đi thẳng tới nghệ sĩ, nền tảng không giữ tiền.</p></div>`;
    if((isCust||staff)&&!a.payout)html+=`<div class="err">Nghệ sĩ chưa khai tài khoản nhận tiền — điều phối sẽ liên hệ.</div>`;
    html+=`<div class="money"><div><span>Tổng (đã khóa)</span><b>${vnd(b.total)}</b></div><div><span>Cọc</span><span>${vnd(b.deposit)}</span></div><div><span>Đã nhận (đã xác nhận)</span><span>${vnd(p)}</span></div><div><span>Chờ xác nhận</span><span>${vnd(pendingIn(b))}</span></div>${refunded(b)?`<div><span>Đã hoàn</span><span>${vnd(refunded(b))}</span></div>`:""}<div class="tot"><span>Còn lại</span><span>${vnd(Math.max(0,b.total-p))}</span></div></div>`;
    if(pays.length)html+=`<ul class="list">${pays.map(x=>{const canConfirm=x.status==="cho_doi_soat"&&((x.kind==="hoan_tien"?isCust:isArtist)||staff);return `<li class="card small stack"><div class="between"><span><b>${vnd(x.amount)}</b> · ${x.kind==="coc"?"Cọc":x.kind==="con_lai"?"Phần còn lại":"Hoàn tiền"}</span>${badge(x.status)}</div><span class="muted">${esc(dt(x.at))}${x.note?" · "+esc(x.note):""}${x.reason?" · "+esc(x.reason):""}</span>${canConfirm?`<div class="row"><button class="btn primary" data-a="pay-ok" data-id="${x.id}">${x.kind==="hoan_tien"?"Tôi đã nhận lại":"Đã nhận tiền"}</button><button class="btn ghost" data-a="pay-no" data-id="${x.id}">Không khớp</button></div>`:""}</li>`}).join("")}</ul>`;
    if(isCust&&!ended&&b.total>p+pendingIn(b))html+=`<div class="stack"><div class="two"><div class="field"><label for="pk">Khoản</label><select id="pk"><option value="coc">Cọc</option><option value="con_lai" ${p>=b.deposit?"selected":""}>Phần còn lại</option></select></div><div class="field"><label for="pa">Số tiền (VNĐ)</label><input id="pa" inputmode="numeric" data-money value="${Math.max(0,nextAmt).toLocaleString("vi-VN")}"></div></div><div class="field"><label for="pnote">Thông tin giao dịch</label><input id="pnote" placeholder="Ngân hàng, giờ chuyển" maxlength="300"></div><button class="btn outline" data-a="pay" data-id="${b.id}">Báo đã chuyển khoản</button></div>`;
    if((isArtist||staff)&&p>0)html+=`<details><summary class="btn ghost">Ghi nhận đã hoàn tiền cho khách</summary><div class="stack" style="margin-top:8px"><div class="field"><label for="ra">Số tiền hoàn</label><input id="ra" inputmode="numeric" data-money></div><div class="field"><label for="rr">Lý do</label><input id="rr"></div><button class="btn outline" data-a="refund" data-id="${b.id}">Ghi nhận hoàn</button></div></details>`;
    html+=`</section>`;
    html+=`<section class="card stack"><div class="between"><div class="h3">Phạm vi đã chấp nhận (bản ${b.snap.ver})</div></div>${quoteBox({items:b.snap.items,total:b.snap.total,deposit:b.snap.deposit,scope:b.snap.scope})}<button class="btn ghost" data-a="receipt" data-id="${b.id}">Xem biên nhận booking</button></section>`;
    const incs=S.incidents.filter(i=>i.booking===b.id);
    html+=`<div class="h2">Sự cố</div>${incs.map(i=>`<div class="card sev-${i.sev} stack"><div class="between"><b>${i.sev==="khan"?"KHẨN · ":""}${esc(i.kind)}</b>${badge(i.status)}</div><div class="small">${esc(i.desc)}</div>${i.res?`<div class="small"><b>Xử lý:</b> ${esc(i.res)}</div>`:""}${staff&&i.status!=="dong"?`<div class="field"><label for="ir-${i.id}">Ghi chú xử lý</label><input id="ir-${i.id}" value="${esc(i.res)}"></div><div class="row"><button class="btn ghost" data-a="inc" data-v="dang_xu_ly" data-id="${i.id}">Đang xử lý</button><button class="btn outline" data-a="inc" data-v="da_giai_quyet" data-id="${i.id}">Đã giải quyết</button>${i.artistLock&&artist(i.artistLock).suspendedUntil>now()?`<button class="btn danger" data-a="lift" data-id="${i.id}">Gỡ khóa nghệ sĩ (đúng bất khả kháng)</button>`:""}</div>`:""}</div>`).join("")||'<p class="muted small">Không có sự cố.</p>'}`;
    if(staff&&["cho_xac_nhan","da_xac_nhan","dang_thuc_hien"].includes(b.status)&&now()>=b.start)html+=`<details><summary class="btn danger">Xác nhận nghệ sĩ bỏ show</summary><div class="stack" style="margin-top:8px"><div class="field"><label for="nsn">Căn cứ</label><input id="nsn" placeholder="VD: gọi 3 lần không nghe, khách xác nhận không đến"></div><button class="btn danger" data-a="noshow" data-id="${b.id}">Xác nhận — hủy booking, đề xuất hoàn 100%, khóa nghệ sĩ 90 ngày</button></div></details>`;

    if(!ended&&["cho_xac_nhan","da_xac_nhan"].includes(b.status)&&(isCust||isArtist||staff)){const sug=refundSuggestion(b,isCust?"customer":"artist");

    html+=`<button class="btn ghost" data-a="req" data-id="${r.id}">Tin nhắn và yêu cầu gốc</button></div>`;

      <div class="r-row" style="font-weight:800;border-bottom:2px solid #171923"><span>Tổng</span><span>${vnd(b.total)}</span></div>
      <div class="r-row"><span>Cọc</span><span>${vnd(b.deposit)}</span></div>
      <div class="r-row"><span>Đã nhận (đã xác nhận)</span><span>${vnd(paid(b))}</span></div>
      ${pays.map(p=>`<div class="r-row"><small>${esc(dt(p.at))} · ${p.kind==="hoan_tien"?"Hoàn":"Nhận"}</small><small>${vnd(p.amount)}</small></div>`).join("")}
      <div class="r-row"><span>Trạng thái</span><span>${esc(LBL[b.status])}</span></div>
      <small>Phạm vi: ${esc(b.snap.scope)}</small>
      <small>Điều kiện hủy đã đồng ý: khách hủy ≥30 ngày (tính theo ngày lịch) hoàn 100% cọc, 8–29 ngày 50%, ≤7 ngày 0%; nghệ sĩ hủy hoàn 100% khách đã trả. Tiền chuyển thẳng cho nghệ sĩ.</small>
      <small>Hóa đơn GTGT (nếu cần cho doanh nghiệp) do bên cung cấp dịch vụ xuất theo quy định — bản thật sẽ có hướng dẫn riêng.</small></div>
      <button class="btn primary" data-a="copyrcpt" data-id="${b.id}">${svg("copy")} Sao chép nội dung biên nhận</button></div>`},
  askform:({id})=>`<div class="stack"><h1 class="h1">Hỏi thêm khách</h1><div class="field"><label for="aq">Câu hỏi</label><textarea id="aq"></textarea></div><button class="btn primary" data-a="submitask" data-id="${id}">Gửi câu hỏi</button></div>`,
  declineform:({id})=>`<div class="stack"><h1 class="h1">Không nhận yêu cầu</h1><div class="field"><label for="dr">Lý do</label><select id="dr">${["Không rảnh khung giờ này","Ngân sách thấp hơn mức nhận","Địa điểm quá xa","Thiếu thiết bị yêu cầu","Không đúng phong cách"].map(x=>`<option>${x}</option>`).join("")}</select></div><button class="btn danger" data-a="submitdecline" data-id="${id}">Xác nhận không nhận</button></div>`,
  payno:({id})=>`<div class="stack"><h1 class="h1">Khoản tiền không khớp</h1><p class="hint">Điều phối sẽ nhận phiếu sự cố tranh chấp tiền.</p><div class="field"><label for="pr">Lý do</label><textarea id="pr" placeholder="VD: Không thấy tiền trong tài khoản"></textarea></div><button class="btn danger" data-a="submitpayno" data-id="${id}">Gửi</button></div>`,
  liftform:({id})=>{const i=S.incidents.find(x=>x.id===id);return `<div class="stack"><h1 class="h1">Gỡ khóa ${esc(artist(i.artistLock).name)}</h1><p class="hint">Chỉ gỡ khi đã xem giấy tờ chứng minh bất khả kháng.</p><div class="field"><label for="lf">Căn cứ</label><textarea id="lf" placeholder="VD: Đã xem giấy nhập viện ngày …"></textarea></div><button class="btn danger" data-a="submitlift" data-id="${id}">Gỡ khóa</button></div>`},
};
function quoteBox(q){return `<div class="money small">${q.items.map(i=>`<div><span>${esc(i.label&&i.label!==KIND[i.kind]?i.label:KIND[i.kind])}</span><span>${vnd(i.amount)}</span></div>`).join("")}<div class="tot"><span>Tổng</span><span>${vnd(q.total)}</span></div><div><span>Cọc</span><span>${vnd(q.deposit)}</span></div></div><div class="small"><b>Phạm vi:</b> ${esc(q.scope)}</div>`}

/* ----- chia sẻ ----- */
function shareUrl(a){return location.href.split("#")[0]+"#nghe-si-"+a.slug}
function shareSheet(a){
  const url=shareUrl(a);
  document.getElementById("overlay").innerHTML=`<div class="sheet-bg" data-a="closesheet"><div class="sheet stack" role="dialog" aria-label="Chia sẻ hồ sơ">
    <div class="between"><div class="h2">Chia sẻ ${esc(a.name)}</div><button class="btn ghost" data-a="closesheet">Đóng</button></div>
    <p class="hint">Gửi cho người yêu, bạn bè hoặc team để cùng chọn.</p>
    <button class="btn primary block" data-a="nativeshare" data-id="${a.id}">${svg("share")} Chia sẻ qua Zalo, Messenger…</button>
    <button class="btn ghost block" data-a="copylink" data-id="${a.id}">${svg("copy")} Sao chép link</button>
    <input readonly value="${esc(url)}" aria-label="Link hồ sơ" onclick="this.select()">
    <p class="small muted">Nút "Chia sẻ qua…" mở bảng chia sẻ của điện thoại (chọn Zalo hoặc Messenger). Nếu máy không hỗ trợ, dùng "Sao chép link".</p></div></div>`;
}
async function copyText(t,ok){try{await navigator.clipboard.writeText(t);toast(ok)}catch(e){toast("Máy không cho sao chép tự động — giữ vào ô link để sao chép")}}

/* ----- bảng thử nghiệm ----- */
function sheet(){
  const o=document.getElementById("overlay");
  const nextShow=S.bookings.filter(b=>["da_xac_nhan","cho_xac_nhan","dang_thuc_hien"].includes(b.status)).sort((x,y)=>x.start-y.start)[0];
  o.innerHTML=`<div class="sheet-bg" data-a="closesheet"><div class="sheet stack" role="dialog" aria-label="Công cụ thử nghiệm">
    <div class="between"><div class="h2">Thử với vai trò</div><button class="btn ghost" data-a="closesheet">Đóng</button></div>
    <div class="users">${S.users.filter(u=>!S.deleted.includes(u.id)).map(u=>`<button class="user" data-a="as" data-id="${u.id}" aria-current="${u.id===S.me}"><span><b>${esc(u.name)}</b><br><span class="small muted">${esc(u.sub)}</span></span><span class="badge t-info">${ROLE[u.role]}</span></button>`).join("")}</div>
    <div class="h2">Kịch bản mẫu</div><button class="btn outline" data-a="scenario">Tạo yêu cầu cưới có sẵn 3 báo giá để so sánh</button>
    <div class="h2">Tua thời gian</div><p class="hint">Giờ thử: <span class="clock">${esc(dt(now()))}</span>. Thử giữ lịch hết hạn (60 phút), lời mời quá hạn (24 giờ), báo giá sắp hết hạn và ngày diễn.</p>
    <div class="row"><button class="btn ghost" data-a="tt" data-v="${30*MIN}">+30 phút</button><button class="btn ghost" data-a="tt" data-v="${2*H}">+2 giờ</button><button class="btn ghost" data-a="tt" data-v="${D}">+1 ngày</button>${nextShow?`<button class="btn outline" data-a="ttshow" data-id="${nextShow.id}">Tới 1 giờ trước show ${nextShow.code}</button>`:""}<button class="btn ghost" data-a="ttreset">Về giờ thật</button></div>
    <div class="h2">Dữ liệu thử</div><p class="hint">Dữ liệu lưu trên máy này. Đặt lại để bắt đầu từ đầu.</p>
    ${V.confirmReset?`<div class="row"><button class="btn danger" data-a="reset">Xóa và đặt lại</button><button class="btn ghost" data-a="noreset">Không</button></div>`:`<button class="btn danger" data-a="askreset">Đặt lại dữ liệu thử</button>`}
  </div></div>`;
}
function closeSheet(){document.getElementById("overlay").innerHTML="";V.confirmReset=false}
const val=id=>(document.getElementById(id)||{}).value||"";
function readPicker(p){return {date:val(p+"-date"),time:val(p+"-time"),dur:Number(val(p+"-dur"))||3}}
function readReq(){const f=document.getElementById("reqform");const aId=f.dataset.id;const inv=f.dataset.invites?f.dataset.invites.split(",").filter(Boolean):[];const pk=readPicker("f");
  return {event:val("f-event"),svc:aId?artist(aId).svc:inv.length?artist(inv[0]).svc:val("f-svc"),...pk,area:val("f-area"),budget:val("f-budget"),style:val("f-style"),contact:val("f-contact"),notes:val("f-notes"),invite:aId||null,invites:inv}}
function submitRequest(f){act(()=>{const r=createRequest(f);if(f.invites&&f.invites.length)invite(r.id,f.invites);draft.req=null;V.stack=[];V.tab="su-kien";V.stack.push({v:"req",id:r.id})},"Đã gửi yêu cầu")}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a],[data-tab]"); if(!t)return;
  if(t.dataset.tab){closeSheet();setTab(t.dataset.tab);return}
  const a=t.dataset.a,id=t.dataset.id,v=t.dataset.v;
  if(a==="sheet")return sheet();
  if(a==="closesheet"){if(e.target===t||t.tagName==="BUTTON")closeSheet();return}
  if(a==="as"){S.me=id;V={tab:null,stack:[],q:V.q};save();closeSheet();render();scrollTo(0,0);toast("Đang dùng: "+userName(id));return}
  if(a==="scenario"){closeSheet();act(()=>{const r=seedScenario();V.tab="su-kien";V.stack=[{v:"req",id:r.id}]},"Đã tạo yêu cầu có 3 báo giá — đang dùng: Chị Lan");if(S.me!=="u_lan"){S.me="u_lan";render()}return}
  if(a==="tt"){S.offset+=Number(v);save();render();sheet();return}
  if(a==="ttshow"){const b=S.bookings.find(x=>x.id===id);S.offset+=Math.max(0,b.start-H-now());save();render();sheet();return}
  if(a==="ttreset"){S.offset=0;save();render();sheet();return}
  if(a==="askreset"){V.confirmReset=true;sheet();return}
  if(a==="noreset"){V.confirmReset=false;sheet();return}
  if(a==="reset"){S=seed();mem=null;save();V={tab:null,stack:[],q:{text:"",svc:"",occ:"",tag:"",date:"",time:"19:00",dur:3,area:"",price:-1}};closeSheet();render();toast("Đã đặt lại dữ liệu thử");return}
  if(a==="back")return back();
  if(a==="heart"){e.stopPropagation();const l=savedList(),i=l.indexOf(id);if(i>=0)l.splice(i,1);else l.push(id);save();render();toast(i>=0?"Đã bỏ lưu":"Đã lưu — xem ở tab Đã lưu");return}
  if(a==="share"){shareSheet(artist(id));return}
  if(a==="nativeshare"){const ar=artist(id);const data={title:ar.name+" — Đặt nghệ sĩ",text:`${ar.name} · ${SVC[ar.svc]} · ${ar.genres}`,url:shareUrl(ar)};if(navigator.share){navigator.share(data).then(()=>closeSheet()).catch(err=>{if(err&&err.name!=="AbortError")copyText(data.url,"Không mở được bảng chia sẻ — đã sao chép link")})}else copyText(data.url,"Máy không có bảng chia sẻ — đã sao chép link");return}
  if(a==="copylink"){copyText(shareUrl(artist(id)),"Đã sao chép link hồ sơ");return}
  if(a==="occ"){V.q={...V.q,occ:v,tag:"",price:-1};go({v:"search"});return}
  if(a==="coll"){V.q={...V.q,tag:v,occ:"",price:-1};go({v:"search"});return}
  if(a==="price"){V.q={...V.q,price:Number(v),tag:"",occ:""};go({v:"search"});return}
  if(a==="satsearch"){const sat=nextSat(now());V.q={...V.q,date:vnDate(sat),time:"19:00",dur:3};go({v:"search"});return}
  if(a==="clearq"){V.q={text:"",svc:"",occ:"",tag:"",date:"",time:"19:00",dur:3,area:"",price:-1};render();return}
  if(a==="qdate"){const el=document.getElementById(t.dataset.p+"-date");if(el)el.value=v;t.parentElement.querySelectorAll("[data-a=qdate]").forEach(x=>x.setAttribute("aria-pressed",x===t));return}
  if(a==="checkav"){Object.assign(V.q,readPicker("ap"));if(!V.q.date){showErr("Chọn ngày để kiểm tra lịch.");return}render();return}
  if(a==="artist")return go({v:"artist",id});
  if(a==="newreq"){if(me().role!=="customer"){showErr("Đổi sang vai trò khách (nút tên người dùng) để gửi yêu cầu.");return}return go({v:"newreq",id})}
  if(a==="reqsaved"){const l=savedList().map(artist).filter(x=>x&&x.status==="da_duyet");const svc=l[0].svc;const same=l.filter(x=>x.svc===svc).slice(0,3).map(x=>x.id);if(l.some(x=>x.svc!==svc))toast(`Gửi cho ${same.length} ${SVC[svc]} — mỗi yêu cầu chỉ một loại dịch vụ`);return go({v:"newreq",invites:same})}
  if(a==="login")return go({v:"login"});
  if(a==="sendotp")return act(()=>sendOtp(val("lp")),"Đã gửi mã (mô phỏng): 123456");
  if(a==="resend"){S.otp=null;save();render();return}
  if(a==="verify"){const code=[...document.querySelectorAll(".otpd")].map(x=>x.value).join("");act(()=>{verifyOtp(code);V.stack.pop()},"Đã xác thực số điện thoại");if(S.verified[S.me]&&draft.pendingSubmit){const f=draft.pendingSubmit;draft.pendingSubmit=null;submitRequest(f)}return}
  if(a==="req")return go({v:"req",id});
  if(a==="booking")return go({v:"booking",id});
  if(a==="quote")return go({v:"quote",id});
  if(a==="compare")return go({v:"compare",id});
  if(a==="receipt")return go({v:"receipt",id});
  if(a==="copyrcpt"){copyText(document.getElementById("rcpt").innerText,"Đã sao chép biên nhận");return}
  if(a==="notif"){const n=S.notifs.find(x=>x.id===id);if(n&&n.go){if(n.go.v==="inv")return setTab("loi-moi");if(n.go.v==="cal")return setTab("lich");return go(n.go)}return}
  if(a==="askq")return go({v:"askform",id});
  if(a==="decline")return go({v:"declineform",id});
  if(a==="lift")return go({v:"liftform",id});
  if(a==="invite")return act(()=>invite(id,[...document.querySelectorAll(".inv:checked")].map(x=>x.value)),"Đã gửi lời mời");
  if(a==="accept")return act(()=>{acceptQuote(id);const q=S.quotes.find(x=>x.id===id);if(V.stack.length&&V.stack[V.stack.length-1].v==="compare")V.stack.pop();if(!V.stack.length||V.stack[V.stack.length-1].v!=="req")V.stack.push({v:"req",id:q.req})},"Đã giữ lịch 60 phút");
  if(a==="release")return act(()=>releaseHold(id),"Đã bỏ giữ lịch");
  if(a==="confirm")return act(()=>{if(!document.getElementById("agree").checked)fail("Tick đồng ý phạm vi và điều kiện hủy.");const b=confirmBooking(id,val("addr"));V.stack.pop();V.stack.push({v:"booking",id:b.id})},"Đã tạo booking");
  if(a==="msg")return act(()=>{postMessage(id,val("mt"),val("mb"));V.thread=val("mt")},"Đã gửi tin nhắn");
  if(a==="closereq")return act(()=>{const r=S.requests.find(x=>x.id===id);if(!["da_gui","dang_tim"].includes(r.status))fail("Không thể hủy.");r.status="huy";S.invitations.forEach(i=>{if(i.req===id&&["moi","hoi_them","da_bao_gia"].includes(i.status))i.status="dong"})},"Đã hủy yêu cầu");
  if(a==="pay")return act(()=>reportPayment(id,val("pk"),val("pa"),val("pnote")),"Đã báo chuyển khoản — chờ nghệ sĩ xác nhận");
  if(a==="pay-ok")return act(()=>confirmPayment(id,"da_nhan",me().role==="coordinator"?"Điều phối xác nhận theo sao kê":""),"Đã xác nhận");
  if(a==="pay-no")return go({v:"payno",id});
  if(a==="refund")return act(()=>recordRefund(id,val("ra"),val("rr")),"Đã ghi nhận hoàn tiền");
  if(a==="adv")return act(()=>advance(id,v),"Đã cập nhật");
  if(a==="incident")return act(()=>openIncident(id,val("ik"),val("idesc")),"Đã gửi sự cố cho điều phối");
  if(a==="inc")return act(()=>updateIncident(id,v,val("ir-"+id)),"Đã cập nhật sự cố");
  if(a==="noshow")return act(()=>markNoShow(id,val("nsn")),"Đã xác nhận bỏ show");
  if(a==="cancel")return act(()=>cancelBooking(id,val("cr"),(document.getElementById("cf")||{}).checked),"Đã hủy booking");
  if(a==="busy"){const pk=readPicker("bs");draft.busy=pk;return act(()=>{addBusy(pk.date,pk.time,pk.dur,val("bn"));draft.busy=null},"Đã lưu lịch bận")}
  if(a==="payout")return act(()=>setPayout(val("pb"),val("pn"),val("ph")),"Đã lưu tài khoản nhận tiền");
  if(a==="askdel"){V.confirmDel=true;render();return}
  if(a==="nodel"){V.confirmDel=false;render();return}
  if(a==="delacc")return act(()=>{deleteAccount();V.confirmDel=false;const next=S.users.find(u=>!S.deleted.includes(u.id));S.me=next.id;V={tab:null,stack:[],q:V.q}},"Đã xóa tài khoản — chuyển sang người dùng thử khác");
  if(a==="submitask")return act(()=>{respond(id,"hoi_them",val("aq"));V.stack.pop()},"Đã gửi câu hỏi");
  if(a==="submitdecline")return act(()=>{respond(id,"tu_choi",val("dr"));V.stack.pop()},"Đã báo không nhận");
  if(a==="submitpayno")return act(()=>{confirmPayment(id,"tu_choi",val("pr"));V.stack.pop()},"Đã báo không khớp — điều phối sẽ xử lý");
  if(a==="submitlift")return act(()=>{const i=S.incidents.find(x=>x.id===id);liftSuspension(i.artistLock,val("lf"));i.res=(i.res?i.res+" · ":"")+"Gỡ khóa: "+val("lf").trim();V.stack.pop()},"Đã gỡ khóa nghệ sĩ");
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches('[role="link"][data-a]')){e.preventDefault();e.target.click()}});
document.addEventListener("input",e=>{if(e.target.id==="hs-date"){e.target.classList.toggle("has",!!e.target.value);const ph=e.target.parentElement.querySelector(".ph");if(ph)ph.hidden=!!e.target.value}if(e.target.classList.contains("otpd")){e.target.value=e.target.value.replace(/\D/g,"").slice(-1);if(e.target.value){const n=document.querySelector(`.otpd[data-i="${+e.target.dataset.i+1}"]`);if(n)n.focus()}}});
document.addEventListener("paste",e=>{if(e.target.classList&&e.target.classList.contains("otpd")){const d=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,6);if(d.length){e.preventDefault();document.querySelectorAll(".otpd").forEach((x,i)=>x.value=d[i]||"")}}});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="homesearch"||e.target.id==="searchform"){
    if(e.target.id==="homesearch")Object.assign(V.q,{text:val("hs-text").trim(),date:val("hs-date"),svc:val("hs-svc")});
    else Object.assign(V.q,{text:val("sq-text").trim(),svc:val("sq-svc"),occ:val("sq-occ"),tag:val("sq-tag"),price:Number(val("sq-price")),area:val("sq-area").trim(),...readPicker("sq")});
    if(V.stack.length&&V.stack[V.stack.length-1].v==="search")render();else go({v:"search"});return}
  if(e.target.id==="reqform"){const f=readReq();draft.req=f;
    if(!S.verified[S.me]){draft.pendingSubmit=f;go({v:"login"});toast("Xác thực số điện thoại để gửi yêu cầu");return}
    submitRequest(f);return}
  if(e.target.id==="quoteform"){const id=e.target.dataset.id;const ks=[...e.target.querySelectorAll(".qk")].map(x=>x.value),ls=[...e.target.querySelectorAll(".ql")].map(x=>x.value),as=[...e.target.querySelectorAll(".qa")].map(x=>x.value);
    act(()=>{const items=ks.map((k,n)=>({kind:k,label:ls[n].trim()||KIND[k],amount:parseVnd(as[n])})).filter(x=>x.amount!==null);sendQuote(id,items,val("qd"),Number(val("qv"))||5,val("qs"));V.stack.pop()},"Đã gửi báo giá");}
});
function route(){const m=/^#nghe-si-([a-z0-9-]+)$/.exec(location.hash);if(!m)return;const a=S.artists.find(x=>x.slug===m[1]&&x.status==="da_duyet");if(a){V.stack=[{v:"artist",id:a.id}];render()}}
window.addEventListener("hashchange",route);
setInterval(()=>{const before=JSON.stringify([S.holds.map(h=>h.status),S.invitations.map(i=>i.status),S.quotes.map(q=>q.status+(q.warned?1:0))]);sweep();if(JSON.stringify([S.holds.map(h=>h.status),S.invitations.map(i=>i.status),S.quotes.map(q=>q.status+(q.warned?1:0))])!==before){save();render()}},20000);
load(); if(!S||S.v!==2){S=seed();save()} render(); route();
</script>
